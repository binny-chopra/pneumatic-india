<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pneumatic India — Hydraulic Hoses, Fittings, Couplings & Valves</title>
    <meta
      name="description"
      content="Pneumatic India, Ludhiana — ISO 9001, ISO 14001 & IATF 16949 certified manufacturer of hydraulic hoses, adapters, end fittings, couplings, distributor valves and manifold blocks. Sizes 1/8 inch to 12 inch, pressures up to 2000 bar."
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Apply saved / system theme before first paint to avoid a flash of the wrong mode -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('pi-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* storage blocked — fall back to light, harmless */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
